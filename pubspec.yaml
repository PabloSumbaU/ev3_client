name: ev3_client
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_joystick: ^0.0.4
  flutter_vibrate: ^1.3.0
  google_generative_ai: ^0.4.0
  logging: ^1.2.0
  permission_handler: ^11.3.1
  speech_to_text: ^6.6.1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf
