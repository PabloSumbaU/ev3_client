allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    project.pluginManager.withPlugin('com.android.library') {
        if (project.android.namespace == null) {
            project.android.namespace = "com.example.${project.name.replace('-', '_')}"
        }
        // Algunos plugins (p. ej. vibration) fijan compileSdk 33 en su propio
        // build.gradle, despues de este bloque. finalizeDsl lo corrige al final,
        // porque las librerias de AndroidX actuales exigen compilar con 34+.
        project.androidComponents.finalizeDsl { ext ->
            ext.compileSdk = 36
        }
    }
}
